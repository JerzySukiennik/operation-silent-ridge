; Project overrides of the engine scalability groups (RTX 3050 Laptop 4 GB target, Epic look)
[TextureQuality@3]
; scene streams ~100-150 MB of mips; 1000 MB (engine Epic default) only eats the VRAM budget
r.Streaming.PoolSize=600

[TextureQuality@2]
r.Streaming.PoolSize=500

[AntiAliasingQuality@3]
; Epic TSR keeps a 200 % history (3840x2160 at 1080p): ~2 ms on the RTX 3050 for no visible gain at 1080p
r.TSR.History.ScreenPercentage=100
